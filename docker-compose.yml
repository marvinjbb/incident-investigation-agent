services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_lab}
      POSTGRES_USER: ${POSTGRES_USER:-incident_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_lab_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - incident-postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-incident_lab}
      POSTGRES_USER: ${POSTGRES_USER:-incident_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_lab_dev}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-incident_lab}
      POSTGRES_USER: ${POSTGRES_USER:-incident_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_lab_dev}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      INCIDENT_MAX_DURATION_SECONDS: ${INCIDENT_MAX_DURATION_SECONDS:-120}
      REMEDIATION_PROPOSAL_TTL_SECONDS: ${REMEDIATION_PROPOSAL_TTL_SECONDS:-300}
      DEMO_SESSION_TTL_SECONDS: ${DEMO_SESSION_TTL_SECONDS:-1800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-api.marvinjb.dev,localhost,127.0.0.1,test,testserver}
      EXPOSE_INTERNAL_ROUTES: ${EXPOSE_INTERNAL_ROUTES:-true}
      UVICORN_WORKERS: "1"
      LOG_PATH: /app/logs/application.jsonl
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      INVESTIGATION_MAX_ITERATIONS: ${INVESTIGATION_MAX_ITERATIONS:-6}
      INVESTIGATION_MAX_TOOL_CALLS: ${INVESTIGATION_MAX_TOOL_CALLS:-10}
      INVESTIGATION_TIMEOUT_SECONDS: ${INVESTIGATION_TIMEOUT_SECONDS:-45}
      INVESTIGATION_MAX_OUTPUT_TOKENS: ${INVESTIGATION_MAX_OUTPUT_TOKENS:-3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - incident-application-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  incident-postgres-data:
  incident-application-logs:
